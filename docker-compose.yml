x-hadoop: &hadoop
  image: trendcast-hadoop:3.4.2
  build:
    context: .
    dockerfile: infra/hadoop/Dockerfile
  environment:
    HADOOP_HEAPSIZE_MAX: "512"
    HADOOP_HEAPSIZE: "512"
  mem_limit: 1g

x-spark: &spark
  image: trendcast-spark:3.5.7
  build:
    context: .
    dockerfile: infra/spark/Dockerfile
  environment:
    HADOOP_CONF_DIR: /opt/hadoop-conf
    HADOOP_USER_NAME: hadoop
    PYSPARK_PYTHON: python3
    SPARK_DAEMON_MEMORY: 256m
  mem_limit: 1536m

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: trendcast-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Preserve localhost access for Python and add a Docker-internal listener.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["namenode"]
    ports:
      - "127.0.0.1:9870:9870"
    volumes:
      - hdfs_name:/data/name
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/namenode/9000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  datanode-1:
    <<: *hadoop
    hostname: datanode-1
    command: ["datanode"]
    volumes:
      - hdfs_data_1:/data/data
    depends_on:
      namenode:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9866"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  datanode-2:
    <<: *hadoop
    hostname: datanode-2
    command: ["datanode"]
    volumes:
      - hdfs_data_2:/data/data
    depends_on:
      namenode:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9866"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  hdfs-init:
    <<: *hadoop
    command: ["init"]
    depends_on:
      namenode:
        condition: service_healthy
      datanode-1:
        condition: service_healthy
      datanode-2:
        condition: service_healthy
    restart: "no"

  spark-master:
    <<: *spark
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/spark-master/7077"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-worker-1:
    <<: *spark
    hostname: spark-worker-1
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "--cores", "1", "--memory", "1g", "--webui-port", "8081", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy

  spark-worker-2:
    <<: *spark
    hostname: spark-worker-2
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "--cores", "1", "--memory", "1g", "--webui-port", "8081", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy

  bronze:
    <<: *spark
    hostname: bronze
    profiles: ["jobs"]
    entrypoint: ["/opt/trendcast/submit.sh"]
    volumes:
      - spark_ivy:/opt/spark/.ivy2
    depends_on:
      kafka:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started

volumes:
  kafka_data:
  hdfs_name:
  hdfs_data_1:
  hdfs_data_2:
  spark_ivy:
